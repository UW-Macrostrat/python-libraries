[project]
name = "macrostrat.raster_layers"
version = "0.1.0"
description = "Serve indexed cloud-optimized rasters as mosaicked tile layers"
authors = [{ name = "Daven Quinn", email = "dev@davenquinn.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "macrostrat.raster_index>=0.1.0,<1",
    "macrostrat.utils>=1.3.3,<2",
    "titiler.core>=0.18,<0.19",
    "titiler.mosaic>=0.18,<0.19",
    "rio-tiler>=6.6,<7",
    "fastapi>=0.111,<0.140",
    "attrs>=23.1",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "macrostrat.raster_index",
    "macrostrat.utils",
    "pytest>=7.2,<10",
    "httpx>=0.27",
    "pillow>=10.0",
]

[tool.uv]
default-groups = "all"

# No `[tool.uv.sources]` here on purpose: local-path sources propagate into any
# project that depends on this package, which would drag consumers (the tile
# server) onto unreleased checkouts of `macrostrat.database`/`macrostrat.utils`.
# The monorepo root already redirects those to local paths for development here.

[tool.uv.build-backend]
module-name = ["macrostrat"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.9.21,<0.12.0"]
build-backend = "uv_build"
