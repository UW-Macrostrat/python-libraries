[project]
name = "macrostrat.raster_layers"
version = "0.3.1"
description = "Serve indexed cloud-optimized rasters as mosaicked tile layers"
authors = [{ name = "Daven Quinn", email = "dev@davenquinn.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "macrostrat.raster_index>=0.3.1,<1",
    "macrostrat.utils>=1.3.3,<2",
    "titiler.core>=1,<2",
    "titiler.mosaic>=1,<2",
    "rio-tiler>=8,<9",
    "fastapi>=0.111,<0.140",
    "attrs>=23.1",
    "pydantic>=2.7,<3",
]

[project.urls]
Repository = "https://github.com/UW-Macrostrat/python-libraries"
Documentation = "https://github.com/UW-Macrostrat/python-libraries/tree/main/raster-layers#readme"

[dependency-groups]
dev = [
    "macrostrat.raster_index",
    "macrostrat.utils",
    "pytest>=7.2,<10",
    "httpx>=0.27",
    "pillow>=10.0",
    "mapbox-vector-tile>=2.1.0,<3",
]

[tool.uv]
default-groups = "all"

# In-repo dependencies, so this package locks and builds on its own — which is
# what `mono publish` does before releasing it. Note that uv propagates these
# local paths into anything that depends on this package *by path*: consumers
# should install from PyPI, not from a sibling checkout, or they inherit
# unreleased versions of everything below.
[tool.uv.sources]
"macrostrat.raster_index" = { path = "../raster-index", editable = true }
"macrostrat.utils" = { path = "../utils", editable = true }

[tool.uv.build-backend]
module-name = ["macrostrat"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.9.21,<0.12.0"]
build-backend = "uv_build"
