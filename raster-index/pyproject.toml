[project]
name = "macrostrat.raster_index"
version = "0.1.0"
description = "An index of cloud-optimized raster datasets, for mosaicked tile serving"
authors = [{ name = "Daven Quinn", email = "dev@davenquinn.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "macrostrat.database>=3.5,<5",
    "macrostrat.utils>=1.3.3,<2",
    "SQLAlchemy>=2.0.18,<3",
    "GeoAlchemy2>=0.15.2,<0.21.0",
    "rio-tiler>=6.6,<9",
    "rasterio>=1.3.9,<2",
    "shapely>=2.0,<3",
    "numpy>=1.24",
    "pydantic>=2.7,<3",
    "typer>=0.12,<0.27",
    "rich>=13,<16",
]

[project.optional-dependencies]
# Scanning object stores for rasters to register
s3 = ["boto3>=1.28.50,<2"]

[project.scripts]
raster-index = "macrostrat.raster_index.cli:cli"

[dependency-groups]
dev = ["macrostrat.database", "macrostrat.utils", "pytest>=7.2,<10", "boto3>=1.28.50,<2"]

[tool.uv]
default-groups = "all"

# No `[tool.uv.sources]` here on purpose: local-path sources propagate into any
# project that depends on this package, which would drag consumers (the tile
# server) onto unreleased checkouts of `macrostrat.database`/`macrostrat.utils`.
# The monorepo root already redirects those to local paths for development here.

[tool.uv.build-backend]
module-name = ["macrostrat"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.9.21,<0.12.0"]
build-backend = "uv_build"
