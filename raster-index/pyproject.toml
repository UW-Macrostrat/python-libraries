[project]
name = "macrostrat.raster_index"
version = "0.1.1"
description = "An index of cloud-optimized raster datasets, for mosaicked tile serving"
authors = [{ name = "Daven Quinn", email = "dev@davenquinn.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Used only by `create_schema` (applying multi-statement SQL files), and
    # imported lazily there.
    "macrostrat.database>=4.5,<5",
    "macrostrat.utils>=1.3.3,<2",
    "SQLAlchemy>=2.0.18,<3",
    "rio-tiler>=8,<9",
    # rio-tiler 8 already requires >=1.4; stated here because this package opens
    # datasets through rasterio directly.
    "rasterio>=1.4,<2",
    # `testing.py` builds fixture rasters with it.
    "numpy>=1.24",
    "pydantic>=2.7,<3",
    "typer>=0.12,<0.27",
    "rich>=13,<16",
]

[project.urls]
Repository = "https://github.com/UW-Macrostrat/python-libraries"
Documentation = "https://github.com/UW-Macrostrat/python-libraries/tree/main/raster-index#readme"

[project.optional-dependencies]
# Scanning object stores for rasters to register
s3 = ["boto3>=1.28.50,<2"]

[project.scripts]
raster-index = "macrostrat.raster_index.cli:cli"

[dependency-groups]
dev = [
    "macrostrat.database",
    "macrostrat.utils",
    "pytest>=7.2,<10",
    "boto3>=1.28.50,<2",
    # Test-only: asserting on footprint geometry.
    "shapely>=2.0,<3",
]

[tool.uv]
default-groups = "all"

# In-repo dependencies, so this package locks and builds on its own — which is
# what `mono publish` does before releasing it. Note that uv propagates these
# local paths into anything that depends on this package *by path*: consumers
# should install from PyPI, not from a sibling checkout, or they inherit
# unreleased versions of everything below.
[tool.uv.sources]
"macrostrat.database" = { path = "../database", editable = true }
"macrostrat.utils" = { path = "../utils", editable = true }

[tool.uv.build-backend]
module-name = ["macrostrat"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.9.21,<0.12.0"]
build-backend = "uv_build"
